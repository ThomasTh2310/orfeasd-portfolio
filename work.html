<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Selected photographic projects by Orfeas Daktylas.">

  <title>Work — Orfeas Daktylas</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="work-page">

  <!-- HEADER -->

  <header class="site-header">

    <a class="logo" href="index.html">
      ORFEAS DAKTYLAS
    </a>

    <nav class="main-nav">
      <a class="active" href="work.html">Work</a>
      <a href="index.html#books">Books</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>

  </header>


  <!-- PROJECTS -->

  <main>

    <section class="work-section">

      <div class="work-heading">
        <p class="eyebrow">SELECTED PROJECTS</p>
        <h1>Work.</h1>
      </div>

      <div class="project-grid" id="project-grid">
        <!-- Projects generated by JavaScript -->
      </div>

    </section>

  </main>


  <!-- FULLSCREEN SLIDESHOW -->

  <section
    class="photo-viewer"
    id="photo-viewer"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-label="Photo slideshow"
  >

    <!-- TOP CONTROLS -->

    <div class="viewer-top">

      <span id="viewer-counter">
        01 / 01
      </span>

      <button
        class="viewer-close"
        id="viewer-close"
        aria-label="Close slideshow"
      >
        ×
      </button>

    </div>


    <!-- PREVIOUS -->

    <button
      class="viewer-arrow viewer-prev"
      id="viewer-prev"
      aria-label="Previous photo"
    >
      ‹
    </button>


    <!-- IMAGE -->

    <div class="viewer-image-container">

      <img
        id="viewer-image"
        src=""
        alt=""
      >

    </div>


    <!-- NEXT -->

    <button
      class="viewer-arrow viewer-next"
      id="viewer-next"
      aria-label="Next photo"
    >
      ›
    </button>

  </section>


  <!-- FOOTER -->

  <footer>

    <p>
      © <span id="year"></span>
      Orfeas Daktylas. All rights reserved.
    </p>

    <p>
      Photography and images are protected by copyright.
    </p>

  </footer>


  <script src="script.js"></script>

</body>
</html>
